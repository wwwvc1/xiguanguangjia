<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页</title>
    <style id="theme-vars">
:root {
  --brand-background: #fffbf5;
  --brand-foreground: #3e2723;
  --brand-card: #ffffff;
  --brand-card-foreground: #3e2723;
  --brand-popover: #ffffff;
  --brand-popover-foreground: #3e2723;
  --brand-primary: #d97706;
  --brand-primary-foreground: #ffffff;
  --brand-muted: #f3e5d8;
  --brand-muted-foreground: #8d6e63;
  --brand-border: #f3e5d8;
  --brand-input: #f3e5d8;
  --brand-ring: #d97706;

  --brand-radius-sm: 6px;
  --brand-radius-md: 12px;
  --brand-radius-lg: 16px;

  --brand-surface: #fff8f0;
  --brand-surface-2: #f3e5d8;
  --brand-ink: #3e2723;
  --brand-ink-2: #8d6e63;
  --brand-ink-3: #a1887f;
  --brand-line: #f3e5d8;

  --brand-state-success: #65a30d;
  --brand-state-warning: #ea580c;
  --brand-state-error: #dc2626;
  --brand-state-info: #0891b2;

  --brand-shadow-1: 0 1px 2px rgba(62, 39, 35, 0.05), 0 1px 1px rgba(62, 39, 35, 0.03);
  --brand-shadow-2: 0 10px 28px -8px rgba(217, 119, 6, 0.14);

  --brand-font-sans: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --brand-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

.light, :root {
  color-scheme: light;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
    <style id="critical-layout">
      html, body { min-height: 100%; overflow-x: hidden; }
      .login-page { min-height: 100vh; }
      input::placeholder { color: var(--brand-ink-3); }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="login-page relative w-full flex items-center justify-center p-6" style="background-color: var(--brand-background);">
      <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
        <div class="absolute -top-24 -left-24 h-72 w-72 rounded-full opacity-40" style="background: radial-gradient(circle, rgba(217,119,6,0.18) 0%, transparent 70%);"></div>
        <div class="absolute top-1/3 -right-20 h-64 w-64 rounded-full opacity-30" style="background: radial-gradient(circle, rgba(217,119,6,0.16) 0%, transparent 70%);"></div>
        <div class="absolute -bottom-20 left-1/4 h-56 w-56 rounded-full opacity-30" style="background: radial-gradient(circle, rgba(141,110,99,0.12) 0%, transparent 70%);"></div>
      </div>

      <section id="login-card" class="relative z-10 w-full max-w-[420px] rounded-[var(--brand-radius-lg)] p-8 shadow-[var(--brand-shadow-2)]" style="background-color: var(--brand-card);">
        <div class="hero-brand mb-8 text-center">
          <div class="mx-auto mb-4 inline-flex h-14 w-14 items-center justify-center rounded-full" style="background-color: var(--brand-surface); color: var(--brand-primary);">
            <i data-lucide="heart-pulse" class="h-7 w-7"></i>
          </div>
          <h1 class="text-2xl font-semibold tracking-tight" style="color: var(--brand-card-foreground);">习惯管家</h1>
          <p class="mt-2 text-sm" style="color: var(--brand-muted-foreground);">记录每一次微小进步</p>
        </div>

        <form id="login-form" class="login-form space-y-5">
          <div>
            <label for="username" class="mb-2 block text-sm font-medium" style="color: var(--brand-card-foreground);">账号</label>
            <div class="relative">
              <i data-lucide="user" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2" style="color: var(--brand-muted-foreground);"></i>
              <input id="username" name="username" type="text" placeholder="请输入账号" required class="h-11 w-full rounded-[var(--brand-radius-md)] border pl-10 pr-4 text-sm outline-none transition focus:ring-2" style="background-color: var(--brand-surface); border-color: var(--brand-border); --tw-ring-color: var(--brand-ring); color: var(--brand-card-foreground);">
            </div>
          </div>

          <div>
            <label for="password" class="mb-2 block text-sm font-medium" style="color: var(--brand-card-foreground);">密码</label>
            <div class="relative">
              <i data-lucide="lock" class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2" style="color: var(--brand-muted-foreground);"></i>
              <input id="password" name="password" type="password" placeholder="请输入密码" required class="h-11 w-full rounded-[var(--brand-radius-md)] border pl-10 pr-4 text-sm outline-none transition focus:ring-2" style="background-color: var(--brand-surface); border-color: var(--brand-border); --tw-ring-color: var(--brand-ring); color: var(--brand-card-foreground);">
            </div>
          </div>

          <button id="login-btn" type="submit" class="mt-2 h-11 w-full rounded-[var(--brand-radius-md)] text-sm font-medium transition hover:opacity-90 active:scale-[0.99]" style="background-color: var(--brand-primary); color: var(--brand-primary-foreground);">登录</button>
        </form>

        <div class="footer-links mt-6 flex items-center justify-center gap-6 text-sm">
          <a href="#" class="transition hover:underline" style="color: var(--brand-muted-foreground);">忘记密码</a>
          <span class="h-4 w-px" style="background-color: var(--brand-border);"></span>
          <a href="#" class="transition hover:underline" style="color: var(--brand-muted-foreground);">注册账号</a>
        </div>
      </section>
    </main>
    <script>if(window.lucide) lucide.createIcons();</script>
</body>
</html>
