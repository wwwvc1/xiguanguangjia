[pytest]
# pytest 配置文件 — backend 专用

# 测试文件位置:tests/ 目录,文件名 test_*.py
testpaths = tests

# 输出更友好
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --asyncio-mode=auto

# 标记(用来分类跑测试)
markers =
    smoke: 冒烟测试(关键路径)
    auth: 需要登录的测试
    crud: 增删改查测试
    slow: 慢测试(>1秒)
    ai: AI 相关测试(慢,默认跳过)

# 异步支持
asyncio_mode = auto
